name: xctx_agent_domain_universe
version_xctx: v4.2
protocol: protocols/xctx_v4_2.yaml
commands: shared/command_sets/core_commands.yaml
expectations:
  min_agent_domain_count: 4
root:
  domain_level: root
  basic_description: xctx (executable context) is an agent-facing gateway for discovering domain capabilities, observing read-only facts, auditing availability, and following lawful repair paths.
  full_description: >-
    xctx is designed for agents that start with general world knowledge but no local domain knowledge. The root surface advertises agent domains, their statuses, trusted ID boundaries, and next commands an agent can run. The protocol separates YAML capability description from external read-only entrypoints that touch real bundled data.
  next_move_guidance:
    agent_domain_scope_template: "./xctx discover {{agent_domain_id}}::"
    agent_domain_id_context: Replace {{agent_domain_id}} with an id from agent_domains.
    audit_root_run_cmd: ./xctx audit root
    example_agent_domains:
      - stock_intelligence_hub
      - file_manager
xctx_interface:
  id: xctx
  kind: executable_context_protocol
  name: xctx
  basic_description: xctx is the executable context protocol for discovering this universe and moving lawfully into its agent domains.
  full_description: >-
    xctx is the first object an agent discovers. It describes the universe, the active protocol version, the command surface, and the next command that discovers configured agent domains. It is not the business domain itself; it is the agent-facing gateway into the domains.
  run_cmd: ./xctx
  discover_domains_run_cmd: ./xctx discover
agent_domains:
  - id: file_manager
    path: agent_domains/file_manager/domain.yaml
  - id: guess_the_number_game
    path: agent_domains/guess_the_number_game/domain.yaml
  - id: stock_intelligence_hub
    path: agent_domains/stock_intelligence_hub/domain.yaml
  - id: macro_intelligence_hub
    path: agent_domains/macro_intelligence_hub/domain.yaml
  - id: crypto_intelligence_hub
    path: agent_domains/crypto_intelligence_hub/domain.yaml
  - id: options_intelligence_hub
    path: agent_domains/options_intelligence_hub/domain.yaml
  - id: web_search
    path: agent_domains/web_search/domain.yaml

id: equity_filing
kind: agent_subdomain
status: online
basic_description: SEC/EDGAR company filing taxonomy lookup for equity research agents.
full_description: >-
  This subdomain exposes a bundled SQLite filing-form taxonomy. It can explain form codes, canonical filing families, priority buckets, amendment status, and SEC category labels. With an equity instrument context it can tell an agent how to reason about filings for that company, while clearly stating that issuer-specific submission history is not bundled in this reference implementation.
data_description: >-
  Bundled read-only SQLite database: 412 EDGAR form lookup records, 41 canonical families, 12 priority buckets, 51 category labels, and 176 amendment forms.
entrypoint:
  file: connector_supervisor.py
  protocol: json_stdout
  timeout_seconds: 30
connector:
  kind: xctx_native_passthrough
  target_entrypoint: examples/stock_intelligence_hub/adapters/equity_filings.py
  timeout_seconds: 30
data:
  storage_engine: sqlite
  path: data/edgar_form_reference_taxonomy.sqlite
  read_only: true
actions:
  discover:
    priority: 10
    entrypoint_command: discover
    desc: Discover filing taxonomy modes, observable object patterns, and next discovery commands.
    projections:
      default: compact
      allowed:
        - compact
        - full
    argument_patterns:
      - "[--projection compact|full]"
    examples:
      - query: compact filing taxonomy discovery
        run_cmd: ./xctx discover stock_intelligence_hub::equity_filing
      - query: full filing taxonomy discovery
        run_cmd: ./xctx discover stock_intelligence_hub::equity_filing --projection full
    run_cmd: ./xctx discover stock_intelligence_hub::equity_filing [--projection compact|full]
  search_forms:
    domain_affordance: true
    domain_action_name: search_filing_form
    priority: 20
    entrypoint_command: search-forms
    query_required: true
    mode_kind: search
    desc: Search SEC/EDGAR filing form types. Exact form-code queries return the exact form and direct amendment only.
    collection:
      result_path: matches
      default_limit: 10
      max_limit: 50
      cursor: none
      default: compact
      item_projections:
        - compact
        - full
    argument_patterns:
      - "<form code>"
      - "<form name text>"
      - "<family text>"
      - "<priority text>"
      - "<descriptive text>"
      - "[--limit N]"
      - "[--projection compact|full]"
    examples:
      - query: exact annual report form
        run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::search_forms 10-K
      - query: broad annual filing text
        run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::search_forms annual
      - query: domain affordance exact current report form
        run_cmd: ./xctx discover stock_intelligence_hub::search_filing_form 8-K
    related_commands:
      - ./xctx discover stock_intelligence_hub::equity_filing::list_forms
      - ./xctx discover stock_intelligence_hub::equity_filing::search_families <family|text>
      - ./xctx observe stock_intelligence_hub::equity_filing form:10-K
    returns: equity_filing::search_filing_form::result
    run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::search_forms <form code|name|family|priority|text>
  list_forms:
    priority: 25
    entrypoint_command: list-forms
    query_required: false
    mode_kind: list
    desc: List a compact bounded index of SEC/EDGAR filing form taxonomy records without interpreting list_forms as a search term.
    collection:
      result_path: forms
      default_limit: 25
      max_limit: 100
      cursor: optional
      cursor_type: offset
      default: compact
      item_projections:
        - compact
        - full
    argument_patterns:
      - "[--limit N]"
      - "[--cursor CURSOR]"
      - "[--projection compact|full]"
    examples:
      - query: list default bounded form set
        run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::list_forms
      - query: list a smaller bounded form set
        run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::list_forms --limit 10
      - query: list full detail records explicitly
        run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::list_forms --limit 10 --projection full
    related_commands:
      - ./xctx discover stock_intelligence_hub::equity_filing::search_forms
      - ./xctx discover stock_intelligence_hub::equity_filing::search_forms 10-K
    returns: equity_filing_form_list
    run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::list_forms [--limit N] [--cursor CURSOR] [--projection compact|full]
  search_families:
    domain_affordance: true
    domain_action_name: search_filing_family
    priority: 30
    entrypoint_command: search-families
    query_required: true
    mode_kind: search
    desc: Search canonical filing families. Exact family-code queries return the exact family only.
    collection:
      result_path: matches
      default_limit: 10
      max_limit: 50
      cursor: none
      default: compact
      item_projections:
        - compact
        - full
    argument_patterns:
      - "<family code>"
      - "<family name text>"
      - "<descriptive text>"
      - "[--limit N]"
      - "[--projection compact|full]"
    examples:
      - query: exact annual report family
        run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::search_families ANNUAL_REPORT
      - query: broad annual family text
        run_cmd: ./xctx discover stock_intelligence_hub::search_filing_family annual
    related_commands:
      - ./xctx discover stock_intelligence_hub::equity_filing::list_families
      - ./xctx observe stock_intelligence_hub::equity_filing family:ANNUAL_REPORT
    returns: equity_filing::search_filing_family::result
    run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::search_families <family|text>
  list_families:
    priority: 35
    entrypoint_command: list-families
    query_required: false
    mode_kind: list
    desc: List a compact bounded canonical filing-family index without interpreting list_families as a search term.
    collection:
      result_path: families
      default_limit: 25
      max_limit: 100
      cursor: optional
      cursor_type: offset
      default: compact
      item_projections:
        - compact
        - full
    argument_patterns:
      - "[--limit N]"
      - "[--cursor CURSOR]"
      - "[--projection compact|full]"
    examples:
      - query: list canonical filing families
        run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::list_families
      - query: list full detail family records explicitly
        run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::list_families --projection full
    related_commands:
      - ./xctx discover stock_intelligence_hub::equity_filing::search_families
      - ./xctx discover stock_intelligence_hub::equity_filing::search_families ANNUAL_REPORT
    returns: equity_filing_family_list
    run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::list_families [--limit N] [--cursor CURSOR] [--projection compact|full]
  search_priority_buckets:
    domain_affordance: true
    domain_action_name: search_priority_bucket
    priority: 40
    entrypoint_command: search-priority-buckets
    query_required: true
    mode_kind: search
    desc: Search filing priority buckets. Exact priority-code queries return the exact bucket only.
    collection:
      result_path: matches
      default_limit: 10
      max_limit: 50
      cursor: none
      default: compact
      item_projections:
        - compact
        - full
    argument_patterns:
      - "<priority code>"
      - "<priority name text>"
      - "[--limit N]"
      - "[--projection compact|full]"
    examples:
      - query: exact critical bucket
        run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::search_priority_buckets critical_always
      - query: broad critical bucket text
        run_cmd: ./xctx discover stock_intelligence_hub::search_priority_bucket critical
    related_commands:
      - ./xctx discover stock_intelligence_hub::equity_filing::list_priority_buckets
      - ./xctx observe stock_intelligence_hub::equity_filing priority:critical_always
    returns: equity_filing::search_priority_bucket::result
    run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::search_priority_buckets <priority|text>
  list_priority_buckets:
    priority: 45
    entrypoint_command: list-priority-buckets
    query_required: false
    mode_kind: list
    desc: List a compact bounded filing-priority bucket index without interpreting list_priority_buckets as a search term.
    collection:
      result_path: priority_buckets
      default_limit: 25
      max_limit: 100
      cursor: none
      default: compact
      item_projections:
        - compact
        - full
    argument_patterns:
      - "[--limit N]"
      - "[--projection compact|full]"
    examples:
      - query: list priority buckets
        run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::list_priority_buckets
      - query: list full detail priority records explicitly
        run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::list_priority_buckets --projection full
    related_commands:
      - ./xctx discover stock_intelligence_hub::equity_filing::search_priority_buckets
      - ./xctx discover stock_intelligence_hub::equity_filing::search_priority_buckets critical_always
    returns: equity_filing_priority_bucket_list
    run_cmd: ./xctx discover stock_intelligence_hub::equity_filing::list_priority_buckets [--limit N] [--projection compact|full]
  observe:
    priority: 60
    entrypoint_command: observe
    mode_kind: observe
    desc: Observe form:<code>, family:<code>, priority:<code>, or instrument:<ticker> context.
    argument_patterns:
      - "form:<form_code>"
      - "family:<canonical_family_code>"
      - "priority:<priority_bucket_code>"
      - "instrument:<lowercase_ticker>"
    examples:
      - query: observe annual report form
        run_cmd: ./xctx observe stock_intelligence_hub::equity_filing form:10-K
      - query: observe annual report family
        run_cmd: ./xctx observe stock_intelligence_hub::equity_filing family:ANNUAL_REPORT
      - query: observe filing context for an instrument
        run_cmd: ./xctx observe stock_intelligence_hub::equity_filing instrument:aapl
    returns: equity_filing_observation
    run_cmd: ./xctx observe stock_intelligence_hub::equity_filing <form:10-K|family:ANNUAL_REPORT|priority:critical_always|instrument:aapl>

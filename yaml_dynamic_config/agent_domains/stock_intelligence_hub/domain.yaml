id: stock_intelligence_hub
kind: agent_domain
status: online
health: degraded_by_offline_subdomains
basic_description: Equity intelligence domain. The active implementation supports market-data instrument identity/series discovery, EDGAR filing taxonomy discovery, and runtime EDGAR filing acquisition/inventory.
full_description: >-
  stock_intelligence_hub is the trusted namespace for equity-company intelligence. Its online implementation includes market-data instrument identity lookup, bundled OHLCV market-series lookup, filing taxonomy lookup, and a runtime SQLite-backed EDGAR filing library that can plan committed acquisition/indexing of local filing artifacts. The online subdomains share canonical instrument and issuer identifiers, so an agent can safely move from a discovered company to filing questions without inventing IDs.
canonical_identity_policy:
  trusted_id_scope: stock_intelligence_hub
  instrument_id_format: instrument:<lowercase_primary_ticker>
  issuer_id_format: issuer:cik:<10_digit_cik>
  market_series_id_format: market_series:<lowercase_ticker>:daily
  cross_subdomain_rule: Instrument IDs emitted by market_data_gateway are valid inputs to equity_filing for taxonomy context, and issuer/ticker/CIK values can be used with edgar_filing_library for planned filing acquisition.
agent_subdomains:
  market_data_gateway:
    path: subdomains/market_data_gateway/subdomain.yaml
    priority: 10
  equity_filing:
    path: subdomains/equity_filing/subdomain.yaml
    priority: 20
  edgar_filing_library:
    path: subdomains/edgar_filing_library/subdomain.yaml
    priority: 30
  fundamentals_gateway:
    path: subdomains/fundamentals_gateway/subdomain.yaml
    priority: 100

id: file_manager
kind: agent_domain
status: online
health: online
basic_description: File-manager demonstration domain for xctx connector supervisor middleware.
full_description: >-
  file_manager demonstrates how xctx can present a clean protocol surface for an
  existing external command surface. The file_manager domain owns ordinary filesystem
  command adaptation into stable JSON objects; the home_directory subdomain
  configures one safe-root instance while xctx remains a generic YAML-driven
  router.
canonical_identity_policy:
  trusted_id_scope: file_manager
  file_id_format: file:<relative_path>
  directory_id_format: directory:<relative_path>
  cross_subdomain_rule: File and directory identifiers are scoped to configured file_manager subdomains.
agent_subdomains:
  home_directory:
    path: subdomains/home_directory/subdomain.yaml
    priority: 10

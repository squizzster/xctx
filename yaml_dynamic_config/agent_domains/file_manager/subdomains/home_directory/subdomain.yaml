id: home_directory
kind: agent_subdomain
aliases:
  - home
  - files
status: online
basic_description: Safe read-only home-directory view backed by legacy filesystem commands.
full_description: >-
  This subdomain exposes a small bundled directory as a legacy-integration
  demonstration. Discovery lists file and directory identifiers, and can
  classify a concrete discovered file or directory target. Observation returns
  selected object data through middleware-normalized command output without
  letting xctx know filesystem semantics.
data_description: >-
  Bundled read-only demo files under data/file_manager_home. The connector
  allows only paths resolved inside that configured safe root.
entrypoint:
  file: legacy_connector.py
  protocol: json_stdout
  compact_flag: --compact
  timeout_seconds: 10
connector:
  kind: legacy_command
  adapter_scope: domain
  safe_root: data/file_manager_home
  default_limit: 10
  max_limit: 50
  timeout_seconds: 5
  max_output_bytes: 20000
  max_content_bytes: 65536
data:
  storage_engine: filesystem
  path: data/file_manager_home
  read_only: true
actions:
  discover:
    priority: 10
    entrypoint_command: discover
    desc: Discover filesystem object shapes, concrete object metadata, legacy connector status, and next discovery commands.
    discovery_shapes:
      default_shape: compact
      shapes:
        - compact
        - full
    argument_shapes:
      - "[file:<relative_path>|directory:<relative_path>]"
      - "[--shape compact|full]"
    examples:
      - query: compact file-manager discovery
        run_cmd: ./xctx discover file_manager::home_directory
      - query: discover concrete file metadata
        run_cmd: ./xctx discover file_manager::home_directory file:README.txt
      - query: full file-manager discovery
        run_cmd: ./xctx discover file_manager::home_directory --shape full
    returns: legacy_connector_filesystem_discovery
    run_cmd: ./xctx discover file_manager::home_directory [file:<relative_path>|directory:<relative_path>] [--shape compact|full]
  list_files:
    priority: 20
    entrypoint_command: list-files
    aliases:
      - list-files
      - files
    query_required: false
    mode_kind: list
    desc: Discover bounded file identifiers in the safe directory root or a discovered directory.
    collection:
      result_path: files
      default_limit: 10
      max_limit: 50
      cursor: optional
      cursor_type: opaque
      default_shape: compact
      item_shapes:
        - compact
        - full
    argument_shapes:
      - "[directory:<relative_path>]"
      - "[--limit N]"
      - "[--cursor CURSOR]"
      - "[--shape compact|full]"
    examples:
      - query: list root files
        run_cmd: ./xctx discover file_manager::home_directory list_files
      - query: list files under docs
        run_cmd: ./xctx discover file_manager::home_directory list_files directory:docs
    returns: legacy_connector_filesystem_file_list
    run_cmd: ./xctx discover file_manager::home_directory list_files [directory:<relative_path>] [--limit N] [--cursor CURSOR] [--shape compact|full]
  list_directories:
    priority: 30
    entrypoint_command: list-directories
    aliases:
      - list-directories
      - directories
    query_required: false
    mode_kind: list
    desc: Discover bounded directory identifiers in the safe directory root or a discovered directory.
    collection:
      result_path: directories
      default_limit: 10
      max_limit: 50
      cursor: optional
      cursor_type: opaque
      default_shape: compact
      item_shapes:
        - compact
        - full
    argument_shapes:
      - "[directory:<relative_path>]"
      - "[--limit N]"
      - "[--cursor CURSOR]"
      - "[--shape compact|full]"
    examples:
      - query: list root directories
        run_cmd: ./xctx discover file_manager::home_directory list_directories
    returns: legacy_connector_filesystem_directory_list
    run_cmd: ./xctx discover file_manager::home_directory list_directories [directory:<relative_path>] [--limit N] [--cursor CURSOR] [--shape compact|full]
  observe:
    priority: 40
    entrypoint_command: observe
    mode_kind: observe
    desc: Observe a discovered file:<relative_path> or directory:<relative_path> object through the legacy connector; safe text files include bounded contents.
    argument_shapes:
      - "file:<relative_path>"
      - "directory:<relative_path>"
    examples:
      - query: observe bundled readme
        run_cmd: ./xctx observe file_manager::home_directory file:README.txt
      - query: observe docs directory through routed id
        run_cmd: ./xctx observe directory:docs
    returns: legacy_connector_filesystem_observation
    run_cmd: ./xctx observe file_manager::home_directory <file:relative_path|directory:relative_path>

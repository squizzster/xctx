[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xctx-modular-workspace"
version = "4.2.3"
description = "Hardened xctx protocol development workspace with modular command, domain, audit, repair, and planning layers."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
xctx = "xctx.cli:main"

[tool.setuptools.package-dir]
"" = "libs"

[tool.setuptools.packages.find]
where = ["libs"]

[tool.setuptools.package-data]
"xctx" = ["py.typed"]
"xctx_connectors" = ["py.typed"]
"xctx_live" = ["py.typed"]

[tool.setuptools.data-files]
"xctx_workspace" = ["connector_supervisor.py"]
"xctx_workspace/yaml_dynamic_config" = ["yaml_dynamic_config/universe.yaml"]
"xctx_workspace/yaml_dynamic_config/protocols" = ["yaml_dynamic_config/protocols/*.yaml"]
"xctx_workspace/yaml_dynamic_config/shared/command_sets" = ["yaml_dynamic_config/shared/command_sets/*.yaml"]
"xctx_workspace/yaml_dynamic_config/agent_domains/crypto_intelligence_hub" = ["yaml_dynamic_config/agent_domains/crypto_intelligence_hub/*.yaml"]
"xctx_workspace/yaml_dynamic_config/agent_domains/file_manager" = ["yaml_dynamic_config/agent_domains/file_manager/*.yaml"]
"xctx_workspace/yaml_dynamic_config/agent_domains/file_manager/subdomains/home_directory" = ["yaml_dynamic_config/agent_domains/file_manager/subdomains/home_directory/*.yaml"]
"xctx_workspace/yaml_dynamic_config/agent_domains/macro_intelligence_hub" = ["yaml_dynamic_config/agent_domains/macro_intelligence_hub/*.yaml"]
"xctx_workspace/yaml_dynamic_config/agent_domains/options_intelligence_hub" = ["yaml_dynamic_config/agent_domains/options_intelligence_hub/*.yaml"]
"xctx_workspace/yaml_dynamic_config/agent_domains/stock_intelligence_hub" = ["yaml_dynamic_config/agent_domains/stock_intelligence_hub/*.yaml"]
"xctx_workspace/yaml_dynamic_config/agent_domains/stock_intelligence_hub/subdomains/equity_filing" = ["yaml_dynamic_config/agent_domains/stock_intelligence_hub/subdomains/equity_filing/*.yaml"]
"xctx_workspace/yaml_dynamic_config/agent_domains/stock_intelligence_hub/subdomains/fundamentals_gateway" = ["yaml_dynamic_config/agent_domains/stock_intelligence_hub/subdomains/fundamentals_gateway/*.yaml"]
"xctx_workspace/yaml_dynamic_config/agent_domains/stock_intelligence_hub/subdomains/market_data_gateway" = ["yaml_dynamic_config/agent_domains/stock_intelligence_hub/subdomains/market_data_gateway/*.yaml"]
"xctx_workspace/data" = ["data/*.sqlite"]
"xctx_workspace/data/file_manager_home" = ["data/file_manager_home/*.txt"]
"xctx_workspace/data/file_manager_home/archive" = ["data/file_manager_home/archive/.keep"]
"xctx_workspace/data/file_manager_home/docs" = ["data/file_manager_home/docs/*.txt"]
"xctx_workspace/data/file_manager_home/reports" = ["data/file_manager_home/reports/*.txt"]
"xctx_workspace/examples/stock_intelligence_hub" = ["examples/stock_intelligence_hub/*.md"]
"xctx_workspace/examples/stock_intelligence_hub/adapters" = ["examples/stock_intelligence_hub/adapters/*.py"]

[tool.xctx]
engine = "libs/xctx"
entrypoint = "bin/xctx"
protocol = "yaml_dynamic_config/protocols/xctx_v4_2.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: fast framework/unit coverage",
    "integration: connector/subprocess integration coverage",
    "local_gate: required local development gate coverage",
    "slow: slow protocol matrix coverage",
    "timeout(seconds): per-test timeout in seconds",
]
